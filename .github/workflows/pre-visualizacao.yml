# A PRÉ-VISUALIZAÇÃO do site da Flores & Essências, no GitHub Pages:
# https://renatovalente5.github.io/flores-essencias/
#
# Para os donos verem o site antes de haver domínio (o Renato, 16 nov 2026: «usa o meu github
# pages»). Cada envio para a main testa e constrói o site com --base=/flores-essencias (noindex, dados
# legais por escrever como lembretes «[por confirmar: …]») e publica-o aqui. Os termos do GitHub Pages
# não deixam cá uma loja a vender: quando houver domínio, o site vai para o Worker da Cloudflare
# (wrangler.jsonc) e esta página passa a reencaminhar para lá.
name: Pré-visualização

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Todos os dias às 00:15 de Lisboa: as promoções e o aviso do topo têm data de fim, e o site
  # só muda quando se publica.
  schedule:
    - cron: '15 23 * * *'

permissions: {}

# Uma publicação nova cancela a que está a correr: publica-se sempre o commit mais recente.
concurrency:
  group: pre-visualizacao
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # a data de cada página no sitemap sai do histórico do git
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Instalar o Pillow
        run: python -m pip install --disable-pip-version-check 'pillow==11.3.0'
      - name: Guardar as imagens entre publicações
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/imagens
          key: imagens-${{ hashFiles('media/**', 'scripts/imagens.py', 'content/produtos/*.json') }}
          restore-keys: imagens-
      - name: Conferir as fotografias
        run: python scripts/imagens.py --verificar
      - name: Preparar as imagens
        run: python scripts/imagens.py
      - name: Testar o gerador
        run: if [ -f scripts/testar.mjs ]; then node scripts/testar.mjs; else echo 'sem scripts/testar.mjs'; fi
      - name: Construir a pré-visualização
        run: node scripts/build.mjs --base=/flores-essencias --sem-imagens
      - name: Conferir o que sai
        run: |
          set -euo pipefail
          test -f _site/index.html || { echo "FALTA _site/index.html"; exit 1; }
          test -f _site/404.html   || { echo "FALTA _site/404.html"; exit 1; }
          test -z "$(find _site -name '*.md')" || { echo ".md NÃO devia ser publicado"; exit 1; }
          grep -q 'name="robots" content="noindex' _site/index.html || { echo "a pré-visualização tem de ser noindex"; exit 1; }
          echo "ok: $(find _site -type f | wc -l | tr -d ' ') ficheiros"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./_site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
